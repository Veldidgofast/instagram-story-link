<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Read & Share Your Thought</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-color: #fafafa;
      --primary: #2c3e50;
      --accent: #e74c3c;
      --text: #333;
      --muted: #777;
      --radius: 8px;
      --shadow: 0 2px 6px rgba(0,0,0,.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 500px;
      padding: 2rem;
    }
    h1 {
      margin-top: 0;
      font-size: 1.75rem;
      color: var(--primary);
      text-align: center;
    }
    label {
      display: block;
      margin-bottom: .5rem;
      font-weight: 600;
      color: var(--muted);
    }
    select,
    textarea {
      width: 100%;
      padding: .75rem;
      border: 1px solid #ddd;
      border-radius: var(--radius);
      font-size: 1rem;
      margin-bottom: 1.5rem;
      resize: vertical;
    }
    textarea {
      min-height: 100px;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: .75rem 1.5rem;
      border-radius: var(--radius);
      font-size: 1rem;
      cursor: pointer;
      transition: background .2s;
      width: 100%;
    }
    button:hover { background: #c0392b; }
    #thanks {
      margin-top: 1rem;
      color: #27ae60;
      font-weight: 600;
      display: none;
      text-align: center;
    }
    #pdfContainer {
      width: 100%;
      height: 500px;
      border: 1px solid #ddd;
      border-radius: var(--radius);
      overflow: hidden;
      margin: 1.5rem 0;
      background: #f9f9f9;
      position: relative;
    }
    #pdfContainer canvas {
      width: 100% !important;
      height: 100% !important;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--muted);
      font-size: 1.2rem;
    }
    .footer {
      margin-top: 2rem;
      font-size: .85rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Read & Share</h1>

    <label for="lang-select">Choose a language</label>
    <select id="lang-select">
      <option value="arabic">Arabic</option>
      <option value="english">English</option>
    </select>

    <div id="pdfContainer">
      <div class="loading" id="loading">Loading PDF...</div>
      <canvas id="pdfCanvas"></canvas>
    </div>

    <label for="opinion">Your opinion (one or two sentences)</label>
    <textarea id="opinion" placeholder="What did you think after reading?"></textarea>
    <button id="submit">Send opinion</button>

    <p id="thanks">Thank you for sharing!</p>

    <div class="footer">
      Made with ❤️ for your story – link expires automatically.
    </div>
  </div>

  <!-- PDF.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    const pdfBase = 'https://raw.githubusercontent.com/Veldidgofast/instagram-story-link/main';
    const pdfUrls = {
      arabic: pdfBase + '/arabic.pdf',
      english: pdfBase + '/english.pdf'
    };

    const select = document.getElementById('lang-select');
    const loadingEl = document.getElementById('loading');
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');

    let pdfDoc = null,
        pageNum = 1,
        pageRendering = false,
        pageNumPending = null,
        scale = 1.5;

    /**
     * Get page info from document, resize canvas accordingly, and render page.
     * @param num Page number
     */
    function renderPage(num) {
      pageRendering = true;
      // Using promise to fetch the page
      pdfDoc.getPage(num).then(function(page) {
        var viewport = page.getViewport({scale: scale});
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        // Render PDF page into canvas context
        var renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };
        var renderTask = page.render(renderContext);

        // Wait for rendering to finish
        renderTask.promise.then(function () {
          pageRendering = false;
          if (pageNumPending !== null) {
            // New page rendering is pending
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });
    }

    /**
     * If another page rendering in progress, waits until the rendering is
     * finised. Otherwise, executes rendering immediately.
     */
    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    /**
     * Displays previous page.
     */
    function onPrevPage() {
      if (pageNum <= 1) {
        return;
      }
      pageNum--;
      queueRenderPage(pageNum);
    }
    /**
     * Displays next page.
     */
    function onNextPage() {
      if (pageNum >= pdfDoc.numPages) {
        return;
      }
      pageNum++;
      queueRenderPage(pageNum);
    }

    /**
     * Asynchronously downloads PDF.
     */
    function loadPdf(url) {
      loadingEl.style.display = 'block';
      // Using promise to fetch the PDF
      pdfjsLib.getDocument(url).promise.then(function (pdfDoc_) {
        pdfDoc = pdfDoc_;
        document.getElementById('pageCount').textContent = pdfDoc.numPages;
        // Initial/first page rendering
        renderPage(pageNum);
        loadingEl.style.display = 'none';
      }).catch(function (err) {
        loadingEl.textContent = 'Error loading PDF';
        console.error(err);
      });
    }

    // Load initial PDF
    function loadSelectedPdf() {
      const url = pdfUrls[select.value];
      loadPdf(url);
      pageNum = 1;
    }

    select.addEventListener('change', loadSelectedPdf);
    loadSelectedPdf(); // initial load

    const formEndpoint = 'https://formspree.io/f/your_form_id'; // ← REPLACE WITH YOUR Formspree endpoint
    const opinionBox = document.getElementById('opinion');
    const submitBtn = document.getElementById('submit');
    const thanksMsg = document.getElementById('thanks');

    submitBtn.addEventListener('click', async () => {
      const opinion = opinionBox.value.trim();
      if (!opinion) return alert('Please write something first.');

      try {
        const resp = await fetch(formEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            language: select.value,
            opinion: opinion
          })
        });
        if (resp.ok) {
          opinionBox.value = '';
          thanksMsg.style.display = 'block';
          setTimeout(() => thanksMsg.style.display = 'none', 3000);
        } else {
          throw new Error('Network error');
        }
      } catch (e) {
        console.error(e);
        alert('Failed to send. Please try again later.');
      }
    });
  </script>
</body>
</html>
