<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Read &amp; Share Your Thought</title>
<style>
  :root{
    --bg:#0d0f13;
    --surface:#161920;
    --surface-2:#1c2029;
    --surface-3:#232833;
    --line:#282e3a;
    --line-soft:#20252f;
    --text:#eceef2;
    --muted:#98a1b2;
    --faint:#6c7486;
    --accent:#e0605a;
    --accent-hi:#ec7a74;
    --accent-soft:rgba(224,96,90,.13);
    --ok:#4ec9a0;
    --radius:16px;
    --radius-sm:11px;
    --shadow-lg:0 24px 60px -28px rgba(0,0,0,.9);
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    font-family:var(--font);
    color:var(--text);
    line-height:1.6;
    background:
      radial-gradient(1200px 620px at 8% -12%, #1b2333 0%, transparent 58%),
      radial-gradient(1000px 520px at 102% -4%, #26191b 0%, transparent 52%),
      var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:60;
    background:linear-gradient(90deg,var(--accent),var(--accent-hi));transition:width .12s linear}

  .wrap{max-width:820px;margin:0 auto;padding:clamp(20px,4vw,34px) clamp(14px,4vw,22px) calc(90px + var(--safe-b))}

  /* ---------- masthead ---------- */
  .mast{margin-bottom:20px}
  .eyebrow{
    display:inline-flex;align-items:center;gap:7px;
    font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700;
    color:var(--accent);background:var(--accent-soft);
    border:1px solid rgba(224,96,90,.22);
    padding:5px 12px;border-radius:999px;margin-bottom:14px;
  }
  .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}

  /* the article title is the page's real subject */
  .subject{
    font-family:var(--serif);
    font-size:clamp(1.7rem,5.4vw,2.6rem);
    line-height:1.16;margin:0 0 10px;font-weight:600;letter-spacing:-.015em;
  }
  .subject[dir=rtl]{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Amiri,"Traditional Arabic",Georgia,serif;letter-spacing:0}
  .lede{margin:0;color:var(--muted);font-size:clamp(.95rem,2.6vw,1.02rem);max-width:56ch}

  .tabs{
    display:inline-flex;background:var(--surface-2);border:1px solid var(--line);
    border-radius:999px;padding:4px;gap:4px;margin:20px 0 18px;
    position:sticky;top:0;z-index:20;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .tab{
    appearance:none;border:0;background:transparent;color:var(--muted);
    font:inherit;font-size:.92rem;font-weight:550;
    padding:9px 20px;border-radius:999px;cursor:pointer;
    transition:background .2s,color .2s;
  }
  .tab:hover{color:var(--text)}
  .tab[aria-selected="true"]{background:var(--accent);color:#fff;box-shadow:0 3px 14px -4px rgba(224,96,90,.6)}

  /* ---------- reader ---------- */
  .reader{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg)}
  .rbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:9px 12px;border-bottom:1px solid var(--line-soft);background:var(--surface-2);
  }
  .doc{display:flex;align-items:center;gap:9px;min-width:0;flex:1;min-width:140px}
  .doc .badge{
    flex:none;font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    padding:3px 8px;border-radius:6px;background:var(--surface-3);color:var(--muted);
  }
  .doc .name{font-size:.86rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .zoom{display:flex;align-items:center;gap:4px;flex:none}
  .zoom button{
    appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);
    width:32px;height:32px;border-radius:8px;font-size:1rem;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s;
  }
  .zoom button:hover{background:var(--accent-soft);border-color:var(--accent)}
  .zoom .val{
    font-size:.78rem;color:var(--muted);min-width:46px;text-align:center;
    font-variant-numeric:tabular-nums;cursor:pointer;user-select:none;
    border:1px solid transparent;border-radius:6px;padding:4px 2px;
  }
  .zoom .val:hover{color:var(--text);border-color:var(--line)}

  .pager{display:flex;align-items:center;gap:5px;flex:none}
  .pager button{
    appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);
    width:32px;height:32px;border-radius:9px;font-size:1.05rem;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s,transform .1s;
  }
  .pager button:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
  .pager button:active:not(:disabled){transform:scale(.93)}
  .pager button:disabled{opacity:.3;cursor:not-allowed}
  .pc{font-size:.8rem;color:var(--muted);min-width:58px;text-align:center;font-variant-numeric:tabular-nums}

  .stage{
    position:relative;background:#0a0c10;
    height:min(64vh,600px);
    display:flex;align-items:flex-start;justify-content:center;
    overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    touch-action:pan-x pan-y pinch-zoom;
  }
  .stage canvas{display:block}
  .stage .msg{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:.93rem;text-align:center;padding:28px;gap:10px;
  }
  .stage .msg.gone{display:none}
  .spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- reply ---------- */
  .reply{padding:clamp(20px,4vw,26px);border-top:1px solid var(--line-soft);background:var(--surface)}
  .reply h2{
    font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;
    color:var(--faint);margin:0 0 16px;font-weight:700;
  }
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.83rem;color:var(--muted);margin-bottom:7px;font-weight:500}
  .field label .opt{color:var(--faint);font-size:.78rem;font-weight:400}
  input[type=text],textarea{
    width:100%;background:var(--surface-2);color:var(--text);
    border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:13px 15px;font:inherit;font-size:1rem;
    transition:border-color .16s,box-shadow .16s,background .16s;
  }
  input[type=text]:focus,textarea:focus{
    outline:none;border-color:var(--accent);background:var(--surface-3);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  input::placeholder,textarea::placeholder{color:#616979}
  textarea{min-height:112px;resize:vertical;line-height:1.62}
  .meta-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px;font-size:.78rem;color:var(--faint)}
  .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;background:var(--surface-3);padding:2px 6px;border-radius:5px;border:1px solid var(--line)}

  .actions{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
  .send{
    appearance:none;border:0;background:var(--accent);color:#fff;
    font:inherit;font-size:.97rem;font-weight:600;
    padding:12px 28px;border-radius:var(--radius-sm);cursor:pointer;
    transition:filter .16s,transform .1s,opacity .16s;
  }
  .send:hover:not(:disabled){filter:brightness(1.09)}
  .send:active:not(:disabled){transform:translateY(1px)}
  .send:disabled{opacity:.45;cursor:not-allowed}
  .msg-inline{font-size:.88rem;display:none}
  .msg-inline.show{display:inline}
  .msg-inline.good{color:var(--ok)}
  .msg-inline.bad{color:var(--accent)}

  footer.foot{margin-top:26px;text-align:center;color:var(--faint);font-size:.8rem;line-height:1.9}
  footer.foot .t{color:var(--muted)}
  .credit{
    display:inline-flex;align-items:center;gap:7px;margin-top:12px;
    background:var(--surface);border:1px solid var(--line-soft);border-radius:999px;
    padding:7px 15px;color:var(--muted);font-size:.8rem;
    text-decoration:none;transition:color .16s,border-color .16s;
  }
  .credit:hover{color:var(--text);border-color:var(--line)}
  .credit .mark{
    width:17px;height:17px;border-radius:50%;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-hi));
    display:flex;align-items:center;justify-content:center;
    font-size:.62rem;font-weight:800;color:#fff;letter-spacing:0;
  }
  .credit b{color:var(--text);font-weight:600}

  @media (max-width:600px){
    .wrap{padding-left:12px;padding-right:12px}
    .tabs{width:100%;justify-content:center}
    .tab{flex:1;text-align:center;padding:11px 12px}
    .stage{height:56vh}
    .rbar{padding:8px 10px;gap:8px}
    .doc .name{font-size:.8rem}
    .zoom button{width:36px;height:36px}
    .pager button{width:38px;height:38px}
    .actions{gap:10px}
    .send{flex:1;padding:14px 20px}
    textarea{min-height:130px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="progress" id="prog"></div>

<div class="wrap">
  <header class="mast">
    <span class="eyebrow"><span class="dot"></span>Limited time</span>

    <!-- article title doubles as the page heading and the browser tab title -->
    <h1 class="subject" id="subject">&nbsp;</h1>
    <p class="lede">
      Choose your language below and read the piece. When you&rsquo;re done, leave a
      sentence or two. I read every one of them myself.
    </p>

    <div class="tabs" role="tablist" aria-label="Choose language">
      <button class="tab" role="tab" id="tab-arabic"  data-doc="arabic"  aria-selected="true"  aria-controls="stage">العربية</button>
      <button class="tab" role="tab" id="tab-english" data-doc="english" aria-selected="false" aria-controls="stage">English</button>
    </div>
  </header>

  <main class="reader">
    <div class="rbar">
      <div class="doc">
        <span class="badge" id="badge">PDF</span>
        <span class="name" id="docName">Preparing…</span>
      </div>

      <div class="zoom">
        <button id="zOut" aria-label="Zoom out">&minus;</button>
        <span class="val" id="zVal" title="Tap to reset to fit">100%</span>
        <button id="zIn" aria-label="Zoom in">+</button>
      </div>

      <div class="pager">
        <button id="prev" aria-label="Previous page" disabled>&lsaquo;</button>
        <span class="pc" id="pc">– / –</span>
        <button id="next" aria-label="Next page" disabled>&rsaquo;</button>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="msg" id="msg"><span class="spin"></span><span id="msgText">Loading document…</span></div>
      <canvas id="canvas"></canvas>
    </div>

    <section class="reply">
      <h2>Your opinion</h2>

      <div class="field">
        <label for="name">Your name <span class="opt">· optional</span></label>
        <input type="text" id="name" placeholder="First name or nickname" maxlength="40" autocomplete="name" enterkeyhint="next">
      </div>

      <div class="field">
        <label for="opinion">Your thought</label>
        <textarea id="opinion" placeholder="What stayed with you after reading?" maxlength="900"></textarea>
        <div class="meta-row">
          <span id="count">0 / 900</span>
          <span><span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> to send</span>
        </div>
      </div>

      <div class="actions">
        <button class="send" id="send" disabled>Send opinion</button>
        <span class="msg-inline" id="inline"></span>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div><span class="t" id="footTitle"></span> &middot; this link stops working after a short while.</div>
    <a class="credit" href="#" onclick="return false;">
      <span class="mark">B</span>
      <span>Made by <b>Basma Badran</b></span>
    </a>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
/* PDF.js worker — omitting this makes every render fail */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

const RAW = "https://raw.githubusercontent.com/Veldidgofast/instagram-story-link/main/";
const DOCS = {
  arabic: {
    url: RAW + "arabic.pdf",
    title: "العنف ضد المرأة",
    roman: "Violence Against Women",
    rtl: true, lang: "ar", badge: "AR"
  },
  english: {
    url: RAW + "english.pdf",
    title: "Rise of the Tomb Raider",
    roman: "Rise of the Tomb Raider",
    rtl: false, lang: "en", badge: "EN"
  }
};
const TOPIC = "op_7308b9f6385d44918d13";   /* live relay topic */

/* Optional but recommended: a Formspree endpoint (https://formspree.io).
   Mail is the only channel that is genuinely private — nobody can read it but you.
   Leave empty to use the relay only. */
const FORM_ENDPOINT = "";   /* e.g. "https://formspree.io/f/abcd1234" */

const $ = id => document.getElementById(id);
const canvas = $("canvas"), ctx = canvas.getContext("2d");
const msgBox = $("msg"), msgText = $("msgText"), stage = $("stage");

let doc = null, page = 1, rendering = false, queued = null, curKey = "arabic";
let zoom = 1;                                  /* multiplier on fit-to-width */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};

/* ---------- rendering: hi-DPI aware, so text stays crisp ---------- */
function dpr(){ return Math.min(3, window.devicePixelRatio || 1); }

function paint(naturalW, naturalH){
  const avail = (stage.clientWidth || 640) - 20;
  const fitScale = avail / naturalW;                 /* css px per pt at zoom 1 */
  const cssScale = fitScale * zoom;
  const renderScale = cssScale * dpr();              /* render at device pixels */

  canvas.style.width  = Math.round(naturalW * cssScale) + "px";
  canvas.style.height = Math.round(naturalH * cssScale) + "px";
  canvas.width  = Math.max(1, Math.round(naturalW * renderScale));
  canvas.height = Math.max(1, Math.round(naturalH * renderScale));

  $("zVal").textContent = Math.round(zoom * 100) + "%";
}

function draw(n){
  rendering = true;
  doc.getPage(n).then(p => {
    const vp1 = p.getViewport({ scale: 1 });        /* natural size in pt */
    paint(vp1.width, vp1.height);
    return p.render({ canvasContext: ctx, viewport: p.getViewport({ scale: cssScaleOf() }) }).promise;
  }).then(() => {
    rendering = false;
    if (queued !== null) { const q = queued; queued = null; draw(q); }
  }).catch(e => {
    rendering = false;
    fail("This page wouldn’t render. Try reloading.", e);
  });
}

/* render scale actually handed to pdf.js */
function cssScaleOf(){
  const avail = (stage.clientWidth || 640) - 20;
  /* recover the scale we just committed to in paint() */
  const w = parseFloat(canvas.style.width);
  const nat = canvas.dataset.nat;
  return nat ? (w / parseFloat(nat)) * dpr() : 1;
}

function queue(n){ rendering ? (queued = n) : draw(n); }

function fail(text, err){
  msgText.textContent = text;
  msgBox.classList.remove("gone");
  canvas.style.display = "none";
  if (err) console.error(err);
}

function syncPager(){
  $("pc").textContent = doc ? (page + " / " + doc.numPages) : "– / –";
  $("prev").disabled = !doc || page <= 1;
  $("next").disabled = !doc || page >= doc.numPages;
}

/* ---------- document switching ---------- */
function applyTitle(key){
  const d = DOCS[key];

  /* the article title becomes the visible subject, tab title and footer */
  const h = $("subject");
  h.textContent = d.title;
  if (d.rtl) h.setAttribute("dir", "rtl"); else h.removeAttribute("dir");

  document.title = d.title;
  $("footTitle").textContent = d.title;
  $("docName").textContent = d.title;
  $("badge").textContent = d.badge;
  document.documentElement.lang = d.lang;
}

function load(key){
  curKey = key;
  const entry = DOCS[key];
  applyTitle(key);

  msgText.textContent = "Loading document…";
  msgBox.classList.remove("gone");
  canvas.style.display = "block";
  page = 1;

  if (doc) { const d = doc; doc = null; try { d.destroy(); } catch(e){} }
  syncPager();

  pdfjsLib.getDocument(entry.url).promise.then(d => {
    doc = d;
    msgBox.classList.add("gone");
    stage.scrollTop = 0;
    d.getPage(1).then(p1 => { canvas.dataset.nat = p1.getViewport({ scale: 1 }).width; });
    draw(1);
    syncPager();
  }).catch(err => {
    fail("Couldn’t load the document. Check your connection and reload.", err);
    syncPager();
  });
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.getAttribute("aria-selected") === "true") return;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected","false"));
    btn.setAttribute("aria-selected","true");
    load(btn.dataset.doc);
    history.replaceState(null, "", "#" + btn.dataset.doc);
  });
});

$("prev").addEventListener("click", () => { if (doc && page > 1){ page--; queue(page); syncPager(); } });
$("next").addEventListener("click", () => { if (doc && page < doc.numPages){ page++; queue(page); syncPager(); } });

/* ---------- zoom ---------- */
function setZoom(z){
  zoom = Math.min(3, Math.max(.5, Math.round(z * 20) / 20));
  store.set("reader_zoom", String(zoom));
  if (doc) draw(page);
}
$("zIn").addEventListener("click",  () => setZoom(zoom + 0.2));
$("zOut").addEventListener("click", () => setZoom(zoom - 0.2));
$("zVal").addEventListener("click", () => setZoom(1));   /* tap % to reset to fit */

/* ---------- paging by gesture / keyboard ---------- */
let tx = 0, ty = 0;
stage.addEventListener("touchstart", e => {
  tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;
}, { passive:true });
stage.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) {
    if (dx < 0) $("next").click(); else $("prev").click();
  }
}, { passive:true });

document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea")) return;
  if (e.key === "ArrowLeft")  $("prev").click();
  if (e.key === "ArrowRight") $("next").click();
  if (e.key === "+" || e.key === "=") setZoom(zoom + 0.2);
  if (e.key === "-") setZoom(zoom - 0.2);
});

/* re-render on resize / rotate so it re-fits and stays sharp */
let rt;
const refit = () => { clearTimeout(rt); rt = setTimeout(() => { if (doc) draw(page); }, 180); };
window.addEventListener("resize", refit);
window.addEventListener("orientationchange", refit);

/* reading progress across pages */
const seen = new Set([1]);
function prog(){
  const pct = doc ? Math.round((seen.size / doc.numPages) * 100) : 0;
  $("prog").style.width = pct + "%";
}
$("prev").addEventListener("click", () => { seen.add(page); prog(); });
$("next").addEventListener("click", () => { seen.add(page); prog(); });
stage.addEventListener("scroll", () => {
  if (doc && stage.scrollTop > 40) { seen.add(page); prog(); }
});

/* ---------- reply ---------- */
const nameEl = $("name"), bodyEl = $("opinion"), sendBtn = $("send"), inline = $("inline");
nameEl.value = store.get("reader_name", "");

function flash(text, good){
  inline.textContent = text;
  inline.className = "msg-inline show " + (good ? "good" : "bad");
  clearTimeout(flash._t);
  flash._t = setTimeout(() => inline.classList.remove("show"), 4500);
}

function validate(){ sendBtn.disabled = bodyEl.value.trim().length === 0; }

bodyEl.addEventListener("input", () => {
  $("count").textContent = bodyEl.value.length + " / 900";
  validate();
});
nameEl.addEventListener("input", () => store.set("reader_name", nameEl.value.trim()));

let sending = false;
sendBtn.addEventListener("click", async () => {
  if (sending) return;
  const body = bodyEl.value.trim();
  if (!body) { bodyEl.focus(); return; }

  sending = true;
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending…";

  const name = nameEl.value.trim().slice(0, 40);
  const when = new Date().toLocaleString();
  const docTitle = DOCS[curKey].title;

  /* structured so the owner inbox can parse fields reliably */
  const payload =
    "lang=" + curKey + "\n" +
    "name=" + (name || "Anonymous") + "\n" +
    "title=" + docTitle + "\n" +
    "time=" + when + "\n" +
    "---\n" + body;

  try {
    const jobs = [
      fetch("https://ntfy.sh/" + TOPIC, {
        method: "POST",
        headers: { "Title": "Opinion", "Priority": "3", "Tags": "speech_balloon" },
        body: payload
      })
    ];
    if (FORM_ENDPOINT) {
      jobs.push(fetch(FORM_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ subject: docTitle, language: curKey, name: name || "Anonymous", opinion: body })
      }));
    }

    const results = await Promise.allSettled(jobs);
    if (results.every(r => r.status === "rejected" || !r.value.ok)) {
      throw new Error("all delivery channels failed");
    }

    bodyEl.value = "";
    $("count").textContent = "0 / 900";
    validate();
    flash("Sent — thank you.", true);
  } catch (e) {
    console.error(e);
    flash("Couldn’t send. Please try once more.", false);
    sendBtn.disabled = false;
  } finally {
    sending = false;
    sendBtn.textContent = "Send opinion";
  }
});

bodyEl.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); sendBtn.click(); }
});

/* ---------- boot ---------- */
zoom = parseFloat(store.get("reader_zoom", "1")) || 1;
const wanted = (location.hash || "").replace("#","");
load(DOCS[wanted] ? wanted : "arabic");
prog();
</script>
